<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise 🎉</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle, #111, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial;
        }

        .video-box iframe {
    width: 320px;
    aspect-ratio: 9 / 16;  
    height: auto;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
    border: none;
}

        iframe {
    width: 280px;
    height: 500px;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
    object-fit: cover;
}

        h2 {
            color: white;
            margin-bottom: 10px;
        }

        .msg {
            color: #ffb6c1;
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #ff4d6d;
            color: white;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="video-box">

    <h2>🎉 Special Birthday Surprise 🎉</h2>

   
    
    <iframe 
    src="https://drive.google.com/file/d/1IB6qrY7JAv21oJK5OWOLG8GVBG9rdQQ4/preview"
    width="280" 
    height="500"
    allow="autoplay"
    allowfullscreen>
</iframe>

    <div class="msg">Made with ❤️ just for you my dear Gunu 🫂</div>

</div>

</body>
</html>
